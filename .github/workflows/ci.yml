name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_evals:
        description: "Run the golden-set evals against Azure OpenAI (uses repository secrets)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC federation to Azure for the eval job; no stored client secrets

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Bicep (syntax and type check)
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t public-procurement-agent:ci .

  evals:
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals
    runs-on: ubuntu-latest
    needs: test
    env:
      PA_MODE: azure
      PA_AZURE_OPENAI_ENDPOINT: ${{ vars.PA_AZURE_OPENAI_ENDPOINT }}
      PA_AZURE_CHAT_DEPLOYMENT: ${{ vars.PA_AZURE_CHAT_DEPLOYMENT }}
      PA_AZURE_EMBEDDING_DEPLOYMENT: ${{ vars.PA_AZURE_EMBEDDING_DEPLOYMENT }}
      PA_AZURE_SEARCH_ENDPOINT: ${{ vars.PA_AZURE_SEARCH_ENDPOINT }}
      PA_DATABASE_URL: sqlite:///data/procurement.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: pip install -e ".[azure,dev]"
      - run: procurement-agent ingest-data --sample
      - run: python evals/run_evals.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/results/
