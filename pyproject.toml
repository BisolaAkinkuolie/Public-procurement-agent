[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "public-procurement-agent"
version = "0.1.0"
description = "An agentic procurement analyst over Canada's open federal contracts data: MCP tools on governed read-only SQL views, plus RAG over public procurement policy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bisola Akinkuolie" }]
dependencies = [
    "mcp>=2.0",
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.16",
    "azure-search-documents>=11.6",
    "azure-monitor-opentelemetry>=1.6",
    "pyodbc>=5.1",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
procurement-agent = "procurement_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
